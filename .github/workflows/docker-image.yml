# 生产镜像：在 GitHub Actions 上构建 Dockerfile，推送到 GitHub Container Registry（ghcr.io/<owner>/eduverse-app）。
# 用于服务器内存 / 磁盘不够构建镜像的情况（next build 需要 2–3GB 内存）：服务器只需 docker pull，
# 在 deploy/.env.production 中设置 APP_IMAGE=ghcr.io/<owner>/eduverse-app:<标签>，然后 docker compose up -d --no-build。
#
# 标签：latest 与 sha-<提交前 7 位>（升级 / 回滚时用 sha 标签固定版本）。
# NEXT_PUBLIC_SITE_URL 在构建时写入镜像：取仓库变量 NEXT_PUBLIC_SITE_URL
# （Settings → Secrets and variables → Actions → Variables），未设置时用下面 env 中的默认值。
# 新建的 GHCR 包默认私有：首次构建后在包设置中改为 Public，服务器即可匿名拉取（镜像不含任何密钥）。
name: 生产镜像（GHCR）

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://eduverse-art.duckdns.org' }}

jobs:
  build:
    # 只为默认分支构建
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 镜像名（GHCR 要求小写）
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eduverse-app" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
