# 仅用于本地开发：启动 PostgreSQL 16。生产部署的 compose 文件在 M8 提供。
# 用法：docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse
      POSTGRES_DB: eduverse
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduverse']
      interval: 5s
      retries: 10

volumes:
  pgdata:
